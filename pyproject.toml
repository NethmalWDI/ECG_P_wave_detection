[tool.poetry]
name = "p_detection"
version = "0.1.0"
description = "This package is for p wave detection related task"
authors = ["Imasha Nethmal"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
matplotlib = "^3.10.1"
scipy = "^1.15.2"
numpy = "^1.24"  # Adjusted to a compatible version
